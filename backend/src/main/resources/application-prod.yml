# Production profile. Start the backend with SPRING_PROFILES_ACTIVE=prod (or --spring.profiles.active=prod).
# These settings have NO defaults on purpose: if any variable below is missing, the backend refuses to start
# instead of silently running with development credentials.
#
#   DB_URL                 e.g. jdbc:postgresql://db-host:5432/specification_db
#   DB_USERNAME            a dedicated database user (not postgres)
#   DB_PASSWORD
#   JWT_SECRET             a private random value of at least 32 characters
#   CORS_ALLOWED_ORIGINS   the production frontend origin(s), comma-separated, e.g. https://spec.unza.zm
#   ATTACHMENTS_DIR        durable storage for uploaded files (included in backups)

spring:
  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"

app:
  jwt:
    secret: "${JWT_SECRET}"
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS}"
  storage:
    attachments-dir: "${ATTACHMENTS_DIR}"

# Interactive API documentation is for development only.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
