server:
  port: 8080

spring:
  application:
    name: specification-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/specification_db
    username: postgres
    password: "11111111"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084,http://localhost:8090
  jwt:
    # Change this secret before deploying to production. Must be >= 256 bits for HS256.
    secret: "${JWT_SECRET:change-this-super-secret-key-for-unza-cict-specification-system-min-32-bytes}"
    expiration-minutes: 480
  storage:
    attachments-dir: "${ATTACHMENTS_DIR:./data/attachments}"
  hr:
    # UNZA HR system integration: two-step sign-in against the live HR API.
    #   1. POST {login-url}     { username, password } -> HR access token
    #   2. GET  {metadata-url}  Authorization: Bearer {hr-token} -> staff profile
    # Only staff with status = 1 (active) in HR may sign in.
    login-url: "${HR_LOGIN_URL:https://hr.unza.zm/api/auth-login2}"
    metadata-url: "${HR_METADATA_URL:https://hr.unza.zm/api/get-meta-data-on-user}"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    zm.unza.cict.specification: INFO
