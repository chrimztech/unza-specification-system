server:
  port: "${SERVER_PORT:8080}"

spring:
  application:
    name: specification-backend

  datasource:
    # Local development defaults; every value can be overridden with the environment variable shown.
    # The prod profile (application-prod.yml) removes these defaults so production must supply them.
    url: "${DB_URL:jdbc:postgresql://localhost:5432/specification_db}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:11111111}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  mail:
    host: "${SMTP_HOST:}"
    port: "${SMTP_PORT:587}"
    username: "${SMTP_USERNAME:}"
    password: "${SMTP_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084,http://localhost:8090}"
  jwt:
    # Change this secret before deploying to production. Must be >= 256 bits for HS256.
    secret: "${JWT_SECRET:change-this-super-secret-key-for-unza-cict-specification-system-min-32-bytes}"
    expiration-minutes: "${JWT_EXPIRATION_MINUTES:480}"
  storage:
    attachments-dir: "${ATTACHMENTS_DIR:./data/attachments}"
  hr:
    # UNZA HR system integration: two-step sign-in against the live HR API.
    #   1. POST {login-url}     { username, password } -> HR access token
    #   2. GET  {metadata-url}  Authorization: Bearer {hr-token} -> staff profile
    # Only staff with status = 1 (active) in HR may sign in.
    login-url: "${HR_LOGIN_URL:https://hr.unza.zm/api/auth-login2}"
    metadata-url: "${HR_METADATA_URL:https://hr.unza.zm/api/get-meta-data-on-user}"
  mail:
    # Email is opt-in — leave SMTP_HOST unset (or MAIL_ENABLED=false) to keep notifications
    # in-app only, which is the default until real SMTP credentials are provided.
    enabled: "${MAIL_ENABLED:false}"
    from: "${MAIL_FROM:no-reply@unza.zm}"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      # Email is opt-in and off by default; an unconfigured SMTP host must not fail
      # the app's overall health check.
      enabled: false

logging:
  level:
    zm.unza.cict.specification: INFO
